# Whole stack behind one gateway:  http://localhost
#
# First time only:
#   cp .env.example .env
#   (cd backend/auth && python scripts/generate_keys.py)   # creates keys/private.pem
#   docker compose up --build

x-jwt: &jwt
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  # Services fetch the PUBLIC key from auth. No shared secret.
  AUTH_JWKS_URL: http://auth-api:8000/.well-known/jwks.json

services:
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-api
      - clinics-api
      - doctors-api
      - patients-api
      - appointments-api
      - frontend

  # ---------------------------------------------------------------- auth
  postgres-auth:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    build: ./backend/auth
    image: auth-service:1.0.0
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      <<: *jwt
      DATABASE_URL: "postgresql+psycopg://${AUTH_POSTGRES_USER}:${AUTH_POSTGRES_PASSWORD}@postgres-auth:5432/${AUTH_POSTGRES_DB}"
      JWT_PRIVATE_KEY_PATH: /run/keys/private.pem
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
    volumes:
      # The private key stays on the host and is mounted read-only into auth only.
      - ./backend/auth/keys:/run/keys:ro
    depends_on:
      postgres-auth:
        condition: service_healthy

  # -------------------------------------------------------------- clinic
  postgres-clinic:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLINIC_POSTGRES_DB}
      POSTGRES_USER: ${CLINIC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CLINIC_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_clinic_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  clinics-api:
    build: ./backend/clinic
    image: clinics-service:1.0.0
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      <<: *jwt
      DATABASE_URL: "postgresql+psycopg://${CLINIC_POSTGRES_USER}:${CLINIC_POSTGRES_PASSWORD}@postgres-clinic:5432/${CLINIC_POSTGRES_DB}"
    depends_on:
      postgres-clinic:
        condition: service_healthy

  # -------------------------------------------------------------- doctor
  postgres-doctor:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCTOR_POSTGRES_DB}
      POSTGRES_USER: ${DOCTOR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCTOR_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_doctor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  doctors-api:
    build: ./backend/doctor
    image: doctors-service:2.0.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *jwt
      DATABASE_URL: "postgresql+psycopg://${DOCTOR_POSTGRES_USER}:${DOCTOR_POSTGRES_PASSWORD}@postgres-doctor:5432/${DOCTOR_POSTGRES_DB}"
      CLINIC_SERVICE_URL: http://clinics-api:8000
    depends_on:
      postgres-doctor:
        condition: service_healthy

  # ------------------------------------------------------------- patient
  postgres-patient:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PATIENT_POSTGRES_DB}
      POSTGRES_USER: ${PATIENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PATIENT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_patient_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  patients-api:
    build: ./backend/patient
    image: patients-service:2.0.0
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      <<: *jwt
      DATABASE_URL: "postgresql+psycopg://${PATIENT_POSTGRES_USER}:${PATIENT_POSTGRES_PASSWORD}@postgres-patient:5432/${PATIENT_POSTGRES_DB}"
      CLINIC_SERVICE_URL: http://clinics-api:8000
    depends_on:
      postgres-patient:
        condition: service_healthy

  # --------------------------------------------------------- appointment
  postgres-appointment:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APPOINTMENT_POSTGRES_DB}
      POSTGRES_USER: ${APPOINTMENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APPOINTMENT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_appointment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  appointments-api:
    build: ./backend/appointment
    image: appointments-service:1.0.0
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      <<: *jwt
      DATABASE_URL: "postgresql+psycopg://${APPOINTMENT_POSTGRES_USER}:${APPOINTMENT_POSTGRES_PASSWORD}@postgres-appointment:5432/${APPOINTMENT_POSTGRES_DB}"
      CLINIC_SERVICE_URL: http://clinics-api:8000
      DOCTOR_SERVICE_URL: http://doctors-api:8000
      PATIENT_SERVICE_URL: http://patients-api:8000
    depends_on:
      postgres-appointment:
        condition: service_healthy

  # The relay publishes the appointment service's outbox to RabbitMQ.
  # Same image as the API, different command; it never runs migrations itself.
  appointments-relay:
    build: ./backend/appointment
    image: appointments-service:1.0.0
    command: ["python", "-m", "app.relay"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://${APPOINTMENT_POSTGRES_USER}:${APPOINTMENT_POSTGRES_PASSWORD}@postgres-appointment:5432/${APPOINTMENT_POSTGRES_DB}"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      <<: *jwt
    depends_on:
      postgres-appointment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      appointments-api:
        condition: service_started

  # ------------------------------------------------------------- messaging
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Catches every email the stack sends. Nothing leaves your machine.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"     # web UI and API: http://localhost:8025

  # ---------------------------------------------------------- notification
  postgres-notification:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-worker:
    build: ./backend/notification
    image: notification-service:1.0.0
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://${NOTIFICATION_POSTGRES_USER}:${NOTIFICATION_POSTGRES_PASSWORD}@postgres-notification:5432/${NOTIFICATION_POSTGRES_DB}"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      SMTP_FROM: clinic@example.com
      MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS}
      RETRY_DELAY_MS: ${NOTIFICATION_RETRY_DELAY_MS}
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ------------------------------------------------------------ frontend
  frontend:
    build: ./frontend
    image: frontend-service:1.0.0
    restart: unless-stopped
    # No published port: the browser reaches it through nginx on http://localhost

volumes:
  postgres_auth_data:
  postgres_clinic_data:
  postgres_doctor_data:
  postgres_patient_data:
  postgres_appointment_data:
  postgres_notification_data:
  rabbitmq_data:
