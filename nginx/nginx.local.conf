# For running the services directly on your machine (uvicorn), with only nginx
# in Docker:  http://localhost  ->  host.docker.internal:<port>
events {}

http {
    upstream auth_service    { server host.docker.internal:8003; }
    upstream clinic_service  { server host.docker.internal:8002; }
    upstream doctor_service  { server host.docker.internal:8000; }
    upstream patient_service { server host.docker.internal:8001; }
    upstream appointment_service { server host.docker.internal:8004; }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /api/v1/auth/docs     { proxy_pass http://auth_service/docs; }
        location = /api/v1/clinics/docs  { proxy_pass http://clinic_service/docs; }
        location = /api/v1/doctors/docs  { proxy_pass http://doctor_service/docs; }
        location = /api/v1/patients/docs { proxy_pass http://patient_service/docs; }
        location = /api/v1/appointments/docs { proxy_pass http://appointment_service/docs; }

        location /api/v1/auth     { proxy_pass http://auth_service; }
        location /api/v1/clinics  { proxy_pass http://clinic_service; }
        location /api/v1/doctors  { proxy_pass http://doctor_service; }
        location /api/v1/patients { proxy_pass http://patient_service; }
        location /api/v1/appointments { proxy_pass http://appointment_service; }
    }
}
