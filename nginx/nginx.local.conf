
# Handles connection-related configuration.
events {}

# HTTP server configuration.
http {
    upstream doctor_service {
        server host.docker.internal:8000;
    }

    upstream patient_service {
        server host.docker.internal:8001;
    }

    server {
        listen 80;

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Doctor Swagger documentation
        location = /api/v1/doctors/docs {
            proxy_pass http://doctor_service/docs;
        }

        location = /api/v1/doctors/openapi.json {
            proxy_pass http://doctor_service/api/v1/doctors/openapi.json;
        }

        # Patient Swagger documentation and OpenAPI schema
        location = /api/v1/patients/docs {
            proxy_pass http://patient_service/docs;
        }

        location = /api/v1/patients/openapi.json {
            proxy_pass http://patient_service/api/v1/patients/openapi.json;
        }

        location = /api/v1/patients {
            proxy_pass http://patient_service;
        }

        # Doctor API
        location /api/v1/doctors/ {
            proxy_pass http://doctor_service;
        }

        # Doctor authentication API
        location /api/v1/auth/ {
            proxy_pass http://doctor_service;
        }

        # Patient API
        location /api/v1/patients/ {
            proxy_pass http://patient_service;
        }
    }
}
