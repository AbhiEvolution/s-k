# Single entry point: http://localhost
#   /api/v1/auth      -> auth service
#   /api/v1/clinics   -> clinic service
#   /api/v1/doctors   -> doctor service
#   /api/v1/patients  -> patient service
#   everything else   -> frontend
# The browser only talks to this one origin, so no CORS is involved.
events {}

http {
    upstream auth_service    { server auth-api:8000; }
    upstream clinic_service  { server clinics-api:8000; }
    upstream doctor_service  { server doctors-api:8000; }
    upstream patient_service { server patients-api:8000; }
    upstream appointment_service { server appointments-api:8000; }
    upstream frontend_app    { server frontend:3000; }

    server {
        listen 80;

        # Inherited by every location below.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Swagger UIs (FastAPI serves them at /docs inside each service).
        location = /api/v1/auth/docs     { proxy_pass http://auth_service/docs; }
        location = /api/v1/clinics/docs  { proxy_pass http://clinic_service/docs; }
        location = /api/v1/doctors/docs  { proxy_pass http://doctor_service/docs; }
        location = /api/v1/patients/docs { proxy_pass http://patient_service/docs; }
        location = /api/v1/appointments/docs { proxy_pass http://appointment_service/docs; }

        # APIs. No URI on proxy_pass, so the original path is forwarded unchanged.
        location /api/v1/auth     { proxy_pass http://auth_service; }
        location /api/v1/clinics  { proxy_pass http://clinic_service; }
        location /api/v1/doctors  { proxy_pass http://doctor_service; }
        location /api/v1/patients { proxy_pass http://patient_service; }
        location /api/v1/appointments { proxy_pass http://appointment_service; }

        # Frontend (single-page app).
        location / { proxy_pass http://frontend_app; }
    }
}
