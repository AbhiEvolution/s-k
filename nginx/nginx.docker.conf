# events handles connection-related configuration.
events {} 

# http is the main container for HTTP server configuration.
http {
    upstream doctor_service {
        server doctors-api:8000;
    }

    upstream patient_service {
        server patients-api:8000;
    }
    
    # server defines how Nginx handles requests for a particular listening address and virtual host.
    server {
        listen 80;

        # FastAPI serves Swagger UI at /docs; expose it under the doctor API prefix.
        location = /api/v1/doctors/docs {
            proxy_pass http://doctor_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI serves Swagger UI at /docs; expose it under the patient API prefix.
        location = /api/v1/patients/docs {
            proxy_pass http://patient_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/patients {
            proxy_pass http://patient_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Doctor service
        # location decides which rule handles an incoming URL.
        location /api/v1/doctors {
            proxy_pass http://doctor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Doctor authentication routes, if separate
        location /api/v1/auth {
            proxy_pass http://doctor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Patient service
        location /api/v1/patients {
            proxy_pass http://patient_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
